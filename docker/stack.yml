version: '3.7'

services:
  convenios-php:
    image: "${DOCKER_IMAGE_TAG}"
    labels:
      - "br.com.cesan.app=${$CI_PROJECT_NAME}"
      - "io.portainer.accesscontrol.teams=adm"

    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - DB_HOST_SICAT=${DB_HOST_SICAT}
      - DB_NAME_SICAT=${DB_NAME_SICAT}
      - DB_USER_SICAT=${DB_USER_SICAT}
      - DB_PASS_SICAT=${DB_PASS_SICAT}
    volumes:
      - /nfs/swarm/convenios-php/anexos:/var/www/html/anexos
      - /etc/localtime:/etc/localtime:ro
      # - ../html:/var/www/html
    ports:
      - 9455:80
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4192M
